name: verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required files (umbrella + docs + case study + PoC + figures)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $required = @(
            "README.md",
            "LICENSE",
            "CHANGELOG.md",
            "CONTRIBUTING.md",
            "SECURITY.md",
            "docs/METHODOLOGY.md",
            "docs/GLOSSARY.md",
            "docs/THREAT-MODEL.md",
            "docs/READING-GUIDE.md",
            "case-studies/README.md",
            "case-studies/kestrel-2-wire-protocol/README.md",
            "case-studies/kestrel-2-wire-protocol/REVIEW.md",
            "case-studies/kestrel-2-wire-protocol/PROMPT.md",
            "case-studies/kestrel-2-wire-protocol/MECHANISM.md",
            "case-studies/kestrel-2-wire-protocol/INSTALL.md",
            "case-studies/kestrel-2-wire-protocol/FAQ.md",
            "case-studies/kestrel-2-wire-protocol/CHANGELOG.md",
            "case-studies/kestrel-2-wire-protocol/examples/session-transcript.md",
            "case-studies/kestrel-2-wire-protocol/examples/poc-session.md",
            "case-studies/kestrel-2-wire-protocol/examples/assets/fig-01-frame-install.png",
            "case-studies/kestrel-2-wire-protocol/examples/assets/fig-02-link-and-lock.png",
            "case-studies/kestrel-2-wire-protocol/examples/assets/fig-03-lock-acknowledged.png",
            "case-studies/kestrel-2-wire-protocol/examples/assets/fig-04-artifact-turn.png",
            ".github/CODEOWNERS",
            ".github/PULL_REQUEST_TEMPLATE.md",
            ".github/ISSUE_TEMPLATE/bug.md"
          )
          $fail = 0
          foreach ($rel in $required) {
            $p = Join-Path (Get-Location) $rel
            if (-not (Test-Path -LiteralPath $p)) {
              Write-Host "MISSING  $rel" -ForegroundColor Red
              $fail = 1
              continue
            }
            $len = (Get-Item -LiteralPath $p).Length
            if ($len -le 0) {
              Write-Host "EMPTY    $rel" -ForegroundColor Red
              $fail = 1
            } else {
              Write-Host ("OK       {0} ({1} bytes)" -f $rel, $len) -ForegroundColor Green
            }
          }
          if ($fail -eq 0) { Write-Host "All required files present." -ForegroundColor Green }
          else            { Write-Host "Verification failed."       -ForegroundColor Red   }
          exit $fail

      - name: Verify PROMPT.md first line matches the artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $p = "case-studies/kestrel-2-wire-protocol/PROMPT.md"
          $first = (Get-Content -LiteralPath $p -TotalCount 1)
          $expected = ":: link established — node K-4 — carrier nominal — no operator present ::"
          if ($first -ne $expected) {
            Write-Host "PROMPT.md first line does not match the artifact header." -ForegroundColor Red
            Write-Host "  got:      $first" -ForegroundColor Red
            Write-Host "  expected: $expected" -ForegroundColor Red
            exit 1
          }
          Write-Host "PROMPT.md first line OK." -ForegroundColor Green

      - name: Guard against old display name
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = Get-ChildItem -Recurse -File -Include *.md,*.yml,*.yaml |
            Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' -and $_.FullName -notmatch '[\\/]assets[\\/]' }
          $bad = @()
          foreach ($f in $files) {
            $hits = Select-String -LiteralPath $f.FullName -Pattern '\b[Rr]ead[\s-]?[Tt]eam(?:ing)?\b'
            if ($hits) { $bad += $hits }
          }
          if ($bad.Count -gt 0) {
            Write-Host "Old display name reappeared in the tree:" -ForegroundColor Red
            $bad | ForEach-Object { Write-Host ("  {0}:{1}" -f $_.Path, $_.LineNumber) -ForegroundColor Red }
            exit 1
          }
          Write-Host "No read-team variants found." -ForegroundColor Green
